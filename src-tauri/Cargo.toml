[package]
name = "ce-git"
version = "1.0.21"
description = "Nested git client"
authors = ["you"]
edition = "2024"

[lib]
name = "ce_git_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures = "0.3"
keyring = { version = "3.6.3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-ico", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Cargo's release defaults already optimize and compile crates in parallel.
# Fat LTO plus a single codegen unit was the long link step, and this app's time is spent in git.
[profile.release]
panic = "abort"
strip = true
